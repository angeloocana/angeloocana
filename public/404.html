<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#070707">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>404 · Page not found · Ângelo Ocanã</title>
    <style>
      @font-face { font-family: 'Instrument Serif'; src: url('/fonts/instrument-serif.woff2') format('woff2'); font-display: swap; }
      body { margin: 0; background: #070707; color: #ece7df; font: 1rem/1.6 system-ui, sans-serif; }
      main { max-width: 50rem; margin-inline: auto; padding: clamp(3rem, 14vh, 9rem) clamp(1.25rem, 5vw, 2.5rem); }
      .code { margin: 0 0 1.5rem; color: #e8b86a; font-size: .75rem; letter-spacing: .24em; }
      .languages { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 2.5rem; border-top: 1px solid #302d28; padding-top: 1.5rem; }
      h1, h2 { margin: 0; font: 400 clamp(2.5rem, 5vw, 3rem)/1 'Instrument Serif', Georgia, serif; }
      section p { margin: 1rem 0; color: #bfb8ad; }
      .links { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; }
      a { display: inline-flex; align-items: center; min-height: 2.75rem; color: #e8b86a; text-underline-offset: .2em; }
      a:focus-visible { outline: 2px solid #e8b86a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · ÂNGELO OCANÃ</p>
      <div class="languages">
        <section>
          <h1>Page not found</h1>
          <p>This page may have moved or no longer exists.</p>
          <div class="links"><a href="/">Home</a> <a href="/#posts">All posts</a></div>
        </section>
        <section lang="pt-BR">
          <h2>Página não encontrada</h2>
          <p>Esta página pode ter mudado de endereço ou não existir mais.</p>
          <div class="links"><a href="/pt/">Início</a> <a href="/pt/#posts">Todos os posts</a></div>
        </section>
      </div>
    </main>
  </body>
</html>
